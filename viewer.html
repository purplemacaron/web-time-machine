<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>웹 타임머신</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; }
  #app { display: flex; flex-direction: column; height: 100vh; background: var(--surface); }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface);
  }
  .logo-sm { width: 24px; height: 24px; image-rendering: pixelated; border-radius: 6px; }
  .app-name { font-size: 14px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .site-chip.sm { padding: 4px 9px; font-size: 12px; max-width: 220px; }
  .year-stepper { display: flex; align-items: center; gap: 5px; }
  .year-input { width: 72px; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  .year-input::-webkit-outer-spin-button, .year-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .skin-ctl { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pixel-strip {
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 12px);
    opacity: .35;
  }
  .addr-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }
  .addr-label { flex: none; }
  .addr-pill {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink);
  }
  .snap-badge {
    flex: none;
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  #frameWrap { position: relative; flex: 1; background: var(--surface); }
  #frame { width: 100%; height: 100%; border: 0; display: block; }
  #overlay {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #overlay.hidden { display: none; }
  .dialog {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-width: 340px;
    max-width: 480px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }
  .dialog .dlg-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .dialog p { margin: 0; line-height: 1.6; color: var(--muted); }
  .spinner {
    width: 18px;
    height: 18px;
    border: 3px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .statusbar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <img src="icons/icon48.png" class="logo-sm" alt="">
    <span class="pixel app-name">웹 타임머신</span>
    <span class="site-chip sm"><span class="dot"></span><span id="siteHost"></span></span>
    <span class="flex"></span>
    <div class="year-stepper">
      <button class="btn icon-btn" id="prevYear" title="1년 전">◀</button>
      <input class="field pixel year-input" id="yearInput" type="number" min="1996">
      <button class="btn icon-btn" id="nextYear" title="1년 후">▶</button>
      <button class="btn primary" id="goYear">이동</button>
    </div>
    <label class="skin-ctl">레트로 스킨
      <button id="skinToggle" class="switch on" role="switch" aria-checked="true" title="아카이브 페이지에 95풍 스타일 적용"><span class="knob"></span></button>
    </label>
    <button class="btn ghost" id="backToPresent">현재로 복귀</button>
  </header>
  <div class="pixel-strip"></div>
  <div class="addr-row">
    <span class="addr-label">원본 주소</span>
    <span class="addr-pill" id="addr"></span>
    <span class="snap-badge pixel" id="snapBadge"></span>
  </div>
  <div id="frameWrap">
    <iframe id="frame" title="아카이브 페이지"></iframe>
    <div id="overlay">
      <div class="dialog">
        <div class="dlg-title pixel" id="overlayTitle">시간 이동</div>
        <div class="spinner" id="overlaySpinner"></div>
        <p id="overlayText">시간 이동 중…</p>
        <button class="btn" id="overlayRetry" hidden>다시 시도</button>
      </div>
    </div>
  </div>
  <footer class="statusbar">
    <span id="status">준비</span>
    <span>출처: Wayback Machine (archive.org)</span>
  </footer>
</div>
<script src="viewer.js"></script>
</body>
</html>
