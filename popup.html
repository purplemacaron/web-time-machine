<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 300px; }
  .window { border: 2px outset #dfdfdf; }
  .body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .site { margin: 0; }
  .year-row { display: flex; align-items: center; gap: 8px; }
  .year-row b { font-size: 16px; min-width: 44px; text-align: center; }
  input[type="range"] { flex: 1; }
  .presets { display: flex; gap: 4px; }
  .presets .btn { flex: 1; padding: 3px 0; }
  .check { display: flex; align-items: center; gap: 6px; }
  .msg { margin: 0; color: #808080; min-height: 14px; }
</style>
</head>
<body>
<div class="window">
  <div class="title-bar"><span class="title">시간 이동 — 웹 타임머신</span></div>
  <div class="body">
    <p class="site">현재 사이트: <b id="host">확인 중…</b></p>
    <div class="year-row">
      <span>연도</span>
      <input type="range" id="year" min="1996" value="2001">
      <b id="yearLabel">2001</b>
    </div>
    <div class="presets">
      <button class="btn" data-year="1999">1999</button>
      <button class="btn" data-year="2005">2005</button>
      <button class="btn" data-year="2010">2010</button>
      <button class="btn" data-year="2015">2015</button>
      <button class="btn" data-year="2020">2020</button>
    </div>
    <label class="check"><input type="checkbox" id="skin" checked> 레트로 스킨 적용</label>
    <button class="btn primary" id="go">과거로 이동</button>
    <p class="msg" id="msg"></p>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
